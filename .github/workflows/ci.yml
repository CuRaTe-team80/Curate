name: Curate CI Pipeline

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Run Placeholder Test
        run: echo "This is a placeholder test step for Sprint 1. CI is working!"
        